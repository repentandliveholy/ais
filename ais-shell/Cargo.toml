[package]
name = "ais-gui"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "ais · AI Sessions — native desktop workspace for AI coding CLIs (Claude Code, Codex, Gemini, agy, OMP, Pi)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/repentandliveholy/ais"
homepage = "https://ais.repentandliveholy.org"
keywords = ["terminal", "ai", "claude", "codex", "gui"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["dist/", ".remember/", ".DS_Store"]

[[bin]]
name = "ais"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
percent-encoding = "2.3.2"
portable-pty = "0.9"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.13"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = "symbols"
debug = "line-tables-only"
split-debuginfo = "packed"
codegen-units = 1
opt-level = "s"
panic = "abort"
