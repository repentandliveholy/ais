[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sessions-launcher"
version = "0.3.0"
description = "A colorful local session browser and launcher for AI coding CLIs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ais = "ai_sessions.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["ai_sessions*"]
