name: ais CLI

on:
  push:
    paths-ignore:
      - "ais-shell/**"
      - ".github/workflows/ais-shell.yml"
  pull_request:
    paths-ignore:
      - "ais-shell/**"
      - ".github/workflows/ais-shell.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and PTY tests
        env:
          TERM: xterm-256color
        run: python -m unittest discover -s tests -v
