name: ais-shell CI

on:
  push:
    paths:
      - "ais-shell/**"
      - ".github/workflows/ais-shell.yml"
  pull_request:
    paths:
      - "ais-shell/**"
      - ".github/workflows/ais-shell.yml"

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ais-shell
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libgtk-3-dev
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release (macOS) & check binary paths
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          # There is no runner.home context; use the real $HOME of the runner.
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME=."
          cargo build --release
          # No pipe: grep -q would close it early and fail strings under pipefail.
          strings target/release/ais-shell > "$RUNNER_TEMP/strings.txt"
          if grep -F -q "$HOME/" "$RUNNER_TEMP/strings.txt"; then
            grep -F "$HOME/" "$RUNNER_TEMP/strings.txt" | head -5 >&2
            echo "Build path leaked into release binary" >&2
            exit 1
          fi
