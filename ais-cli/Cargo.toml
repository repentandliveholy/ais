[package]
name = "ais"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "ais · AI Sessions — browse local AI CLI history (Claude Code, Codex, Gemini, agy, OMP, Pi) and resume any session"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/repentandliveholy/ais"
homepage = "https://ais.repentandliveholy.org"
keywords = ["cli", "tui", "ai", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ais"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
crossterm = "0.28"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
indexmap = { version = "2.6", features = ["serde"] }
jiff = "0.2"
portable-pty = "0.9"
regex = "1.11"
rpassword = "7.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.13"
unicode-general-category = "1.0"
unicode-width = "0.2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.7"

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
opt-level = "s"
panic = "abort"
